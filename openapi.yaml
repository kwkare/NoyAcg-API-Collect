openapi: 3.1.0

info:
  title: NoyAcg API（非官方整理）
  version: 2026.10.27
  summary: noymanga.com 客户端 HTTP API 的非官方描述
  description: |
    NoyAcg（漫画・同人志社区）Web / App 客户端接口的非官方逆向整理，**仅供技术研究**。

    通用约定：

    - 除图床上传（multipart）和书籍详情/评论（`GET` + query）外，其余为 `POST` + `application/x-www-form-urlencoded`；
    - 业务状态放在响应体的 `status` 字段（`ok` / `error` / `login`），HTTP 状态码几乎恒为 `200`；
    - 鉴权靠 Cookie `NOY_SESSION`，由 `POST /api/login` 下发，有效期约 30 天；
    - 内容分级由请求头 `allow-adult` 控制，而不是账号配置；**`/api/home` 不传该头时默认返回 R18**。
    - `/api/home` 还需要请求体 `v=3` 才会返回 `stream`（番剧推荐）。

    字段的校验状态（✅ 实测 / 🟡 部分实测 / ⚠️ 待复测）见仓库文档，本文件只描述结构与已知枚举。
  license:
    name: CC BY-NC 4.0
    identifier: CC-BY-NC-4.0
  contact:
    name: 文档仓库
    url: https://github.com/kwkare/NoyAcg-API-Collect

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://noymanga.com
    description: 线上域名（旧 beta.noyteam.online 已 302 跳转）

tags:
  - name: auth
    description: 登录与会话
  - name: home
    description: 首页聚合
  - name: user
    description: 用户资料与徽章
  - name: book
    description: 漫画详情与评论（GET）
  - name: community
    description: 图床与发帖
  - name: task
    description: 任务系统（签到记录）

security:
  - session: []

paths:
  /api/login:
    post:
      tags: [auth]
      summary: 登录，换取 NOY_SESSION
      operationId: login
      description: |
        邮箱 + 密码换 Cookie。成功时响应头带 `Set-Cookie: NOY_SESSION=…; Max-Age=2592000`。
        失败（账号不存在 / 密码错误 / 被限流）仍是 HTTP 200，只能靠 `status: error` 判断，三者不可区分。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user, pass]
              properties:
                user:
                  type: string
                  format: email
                  description: 注册邮箱
                pass:
                  type: string
                  format: password
                  description: 密码明文（无签名、无 CSRF token）
            examples:
              typical:
                value:
                  user: you@example.com
                  pass: YOUR_PASSWORD
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功（带 Set-Cookie）或失败（status=error）
          headers:
            Set-Cookie:
              description: 成功时下发 `NOY_SESSION=<opaque>; Path=/; Max-Age=2592000`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'

  /api/home:
    post:
      tags: [home]
      summary: 首页聚合数据
      operationId: getHome
      description: |
        一次返回公告、四个榜单（`favDay` / `readDay` / `fs` / `proportion`）、番剧推荐和标签。
        无分页参数，响应约 40 KB。

        - `allow-adult: true` 只返回 R18，`false` 只返回全年龄，`both` 全给；**不传等同 `true`**。
        - **请求体必须带 `v=3` 才会返回 `stream`**（前端真实调用是 `{v:3, stream_all:1}`）。
      parameters:
        - $ref: '#/components/parameters/AllowAdult'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                v:
                  type: integer
                  enum: [3]
                  description: 带 3 才返回 stream 字段
                  examples: [3]
                stream_all:
                  type: integer
                  enum: [1]
                  description: 前端固定传 1；单独传无效果，作用未观察到
                  examples: [1]
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 业务结果，未登录时为 `{"status":"login"}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResult'

  /api/v3/ads:
    post:
      tags: [home]
      summary: 首页广告位
      description: |
        首页渲染时与 `/api/home` 一起调用，返回轮播 / 侧栏广告图。
        与 `/api/home` 相反：不传 `allow-adult` 时等同于 `false`，不会返回成人向素材。
      operationId: getAds
      parameters:
        - $ref: '#/components/parameters/AllowAdult'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 广告列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdsResult'

  /api/v4/signin/record:
    post:
      tags: [task]
      summary: 签到记录
      description: |
        返回连续签到天数与最近一条签到记录。**执行签到**的端点尚未整理。

        注意两点：`status` 这里是数字 `200`（其他接口是字符串 `"ok"`）；返回体里含明文 IP。
      operationId: getSigninRecord
      parameters:
        - $ref: '#/components/parameters/AllowAdult'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 签到记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninRecordResult'

  /api/v3/userinfo:
    post:
      tags: [user]
      summary: 当前用户资料
      operationId: getUserInfo
      description: |
        无请求体（`Content-Length: 0`）。返回邮箱、积分、头像/背景相对路径、佩戴中的徽章。
        也常被当作最轻的会话探活接口使用。
      parameters:
        - $ref: '#/components/parameters/AllowAdult'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效（`{"status":"login"}`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResult'

  /api/badge:
    post:
      tags: [user]
      summary: 徽章列表与佩戴状态
      operationId: getBadges
      description: '`data` 是可用徽章的集合，`show` 是其中正在展示的 Id（注意是字符串数组）。'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeResult'

  /api/v3/set_badge_show:
    post:
      tags: [user]
      summary: 切换徽章佩戴状态
      operationId: toggleBadgeShow
      description: |
        **开关式（toggle）**：同一个 `id` 调一次翻转一次（在 `show` 数组里有则删、无则加，新增追加到末尾），
        没有显式的「设为佩戴/取消」参数，因此重试不幂等。

        ⚠️ **不校验 ID**：任何字符串（不存在的 `114514`、空串）都会被原样写进 `show`，
        响应仍是 `{"status":"ok"}`；清理办法就是再切一次同样的值。脚本请先用 `/api/badge` 校验 ID。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: 徽章 ID，取自 `/api/badge` 的 `data[].Id`；务必先校验，服务端不会检查
                  examples: [8]
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'

  /api/get_image_bucket_token:
    post:
      tags: [community]
      summary: 换图床上传凭证
      operationId: getImageBucketToken
      description: |
        空表单请求，返回短时效的 `token`。拿到后立刻用于 `bucket.noymanga.com/api/upload_image`，
        不要把旧 token 缓存下来复用。
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTokenResult'

  /api/v3/send_community:
    post:
      tags: [community]
      summary: 发帖
      operationId: sendCommunity
      description: |
        写操作，会在站点产生真实内容。

        `image` 是**JSON 数组的字符串**，元素必须带 `image/` 前缀，例如 `["image/91266-xxx.webp"]`；
        文件名来自上传接口返回的 `file`。接口不返回新帖 ID，要确认结果只能去列表页查。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [title, content, platform]
              properties:
                title:
                  type: string
                content:
                  type: string
                image:
                  type: string
                  description: JSON 数组的字符串形式，元素形如 `image/<file>`
                  examples: ['["image/91266-13025882b9402bd576b628a1030433a6388156d5aaeccb40362960af47a4aa79.webp"]']
                platform:
                  type: string
                  enum: [web, android]
                  description: 客户端来源，其他值未验证
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'

  /api/upload_image:
    post:
      tags: [community]
      summary: 上传图片到图床
      operationId: uploadImage
      description: |
        独立域名 `bucket.noymanga.com`，只认表单里的 `token`，**不要**带 `NOY_SESSION` Cookie。

        服务端可能把图片统一转成 `.webp`，返回的 `file` 才是发帖时要用的文件名。
      servers:
        - url: https://bucket.noymanga.com
          description: 图床
      security: []
      parameters:
        - $ref: '#/components/parameters/AllowAdult'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, file]
              properties:
                token:
                  type: string
                  description: "`/api/get_image_bucket_token` 返回的 token"
                file:
                  type: string
                  format: binary
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 上传结果；token 有问题时返回 `{"status":"token_format_error"}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadImageResult'
        '403':
          description: 完全没带 token（2026-10-26 实测）
        '500':
          description: 服务端 / Cloudflare 异常

  /api/v4/signin/sign:
    post:
      tags: [task]
      summary: 执行签到
      description: |
        空表单，无参数。成功加积分（实测 +1），并让 `record.today` 变 true。

        - 成功：`{"continuous":N,"msg":"success","status":200}`
        - 同日重复：`{"msg":"Please do not sign in too frequently","status":500}`（HTTP 仍是 200）
        - 每日 00:00（UTC+8）重置
      operationId: signIn
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 业务结果；`status` 为数字
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninResult'

  /api/v3/community_list:
    post:
      tags: [community]
      summary: 社区帖子列表
      description: |
        `type` 实测支持 `new` / `latest` / `like` / 空（空等同 new）。
        返回的 `len` 是**全站帖子总数**，判断翻页用 `over`。
      operationId: listCommunity
      parameters:
        - $ref: '#/components/parameters/AllowAdult'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [page]
              properties:
                page:
                  type: integer
                  minimum: 1
                type:
                  type: string
                  enum: [new, latest, like, '']
                  default: new
                filter:
                  type: string
                  default: ''
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 帖子列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityListResult'

  /api/v4/community/post/{id}:
    post:
      tags: [community]
      summary: 帖子详情
      description: '返回帖子本体 + 首页评论。注意 `data.uid` 是**当前登录用户**，作者在 `data.post.uid`。'
      operationId: getCommunityPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AllowAdult'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 帖子详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailResult'

  /api/v4/community/post/{id}/comments:
    post:
      tags: [community]
      summary: 评论列表（分页）
      operationId: listCommunityComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AllowAdult'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 评论页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsResult'

  /api/v4/community/post/{id}/reply:
    post:
      tags: [community]
      summary: 发评论 / 回复
      description: |
        `reply_id=-1` 发顶层评论；填某个评论的 `rid` 则是楼中楼回复。

        写操作：会在站点产生真实内容。响应只有 `{"status":"ok"}`，**不返回评论 ID**，
        需要再拉一次评论列表确认。`hide_ip` 是前端固定传 `"false"` 的字段，
        实测评论对象里没有 `ip`，不涉及隐私泄漏。
      operationId: replyToCommunityPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [reply_id, text, platform]
              properties:
                reply_id:
                  type: integer
                  description: '-1 表示顶层评论，否则为被回复评论的 rid'
                  examples: [-1]
                text:
                  type: string
                  description: 正文，支持表情包代码 [noygirl:yeah] 与 NID<id> 书籍引用
                  examples: ['[noygirl:yeah]']
                platform:
                  type: string
                  enum: [web, android]
                hide_ip:
                  type: string
                  enum: ['true', 'false']
                  description: 前端固定传 "false"；实测不影响返回内容
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 发送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'

  /api/v4/community/post/{id}/comment/{rid}/replies:
    post:
      tags: [community]
      summary: 楼中楼列表
      description: |
        某条评论下的回复。按时间**倒序**返回；`root_id` 恒为根评论、`reply_id` 指向被回复的那一条。
        内容通常已内联在帖子详情的 `comments[].replies` 里，本接口主要用于加载更多。
      operationId: listCommentReplies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: rid
          in: path
          required: true
          description: 根评论 ID
          schema:
            type: integer
        - $ref: '#/components/parameters/AllowAdult'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 楼中楼页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentRepliesResult'

  /api/v4/msg/count:
    post:
      tags: [user]
      summary: 未读讯息计数
      description: 导航栏红点用的计数接口，无请求体。
      operationId: getMsgCount
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 未读计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgCountResult'

  /api/v3/get_msg:
    post:
      tags: [user]
      summary: 讯息列表（评论回覆 / 社區回覆 / 系統訊息）
      description: |
        响应顶层 key 跟着 `type` 走，是三种不同结构：`reply` / `community_reply` / `sysmsg`。
        关联对象（书 / 帖子）单独放在 map 里，客户端需要自己 join。
      operationId: getMessages
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [page, type, v]
              properties:
                page:
                  type: integer
                  minimum: 1
                type:
                  type: string
                  enum: [reply, community_reply, sysmsg]
                  description: 評論回覆 / 社區回覆 / 系統訊息
                v:
                  type: integer
                  enum: [3]
                  description: 前端固定 3，含义未确认
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 三类结构之一（由 type 决定）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MsgReplyResult'
                  - $ref: '#/components/schemas/MsgCommunityReplyResult'
                  - $ref: '#/components/schemas/MsgSysmsgResult'

  /api/v3/edit_community_post:
    post:
      tags: [community]
      summary: 编辑帖子
      description: |
        只能改标题与正文，**改不了图片和 `spoiler`**。响应只有 `{"status":"ok"}`，需回读详情确认。

        实测：`time`（发布时间）不变，`Post.edit` 变为当前时间戳。
      operationId: editCommunityPost
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id, title, content]
              properties:
                id:
                  type: integer
                title:
                  type: string
                content:
                  type: string
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 编辑结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'

  /api/v3/community_like:
    post:
      tags: [community]
      summary: 点赞 / 取消点赞（toggle）
      description: |
        开关式：调用一次翻转一次，返回 `{"is_like":bool,"status":"ok"}`。

        ⚠️ 不校验 `cid`：不存在的 ID 也返回 `is_like:true`，但目标帖子没有任何变化。
        别用返回值判断成功，要么回读帖子，要么确保 ID 正确。
      operationId: toggleCommunityLike
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [cid]
              properties:
                cid:
                  type: integer
                  description: 帖子 ID
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 点赞状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'

  /api/v4/book/{bid}:
    get:
      tags: [book]
      summary: 书籍详情（含章节与首屏评论）
      operationId: getBookDetail
      description: |
        一次返回书籍资料、推荐、**全部章节**（按分类的字典）和首屏评论，不需要再请求章节接口。

        `chapters.data` 以分类 id 为 key（不是数组）；官方置顶评论（`uid: 0`）不计入 `comment.count`。
      parameters:
        - name: bid
          in: path
          required: true
          description: 书籍 ID（Bid）
          schema:
            type: integer
        - $ref: '#/components/parameters/AllowAdult'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效（`{"status":"login"}`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResult'

  /api/v4/comment/book/{bid}/comments:
    get:
      tags: [book]
      summary: 书籍评论（分页）
      operationId: listBookComments
      description: |
        结构与帖子评论一致，但主键字段是 `cid`（帖子评论是 `rid`）。

        ⚠️ `top_count` 语义未确认（实测某本书返回 17，并不是置顶条数）。
      parameters:
        - name: bid
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
            default: 1
        - $ref: '#/components/parameters/AllowAdult'
      responses:
        '4XX':
          description: 客户端侧异常（限流 / 参数不合法），具体码未整理
        '200':
          description: 成功或失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCommentsResult'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: NOY_SESSION
      description: 由 `POST /api/login` 下发的会话凭证，有效期约 30 天

  parameters:
    AllowAdult:
      name: allow-adult
      in: header
      required: false
      description: 内容分级过滤；按请求生效，不是账号设置
      schema:
        type: string
        enum: ['true', 'false', 'both']
        default: 'false'

  schemas:
    Status:
      type: string
      enum: [ok, error, login]
      description: |
        业务状态，HTTP 码通常是 200。

        - `ok`：成功
        - `error`：业务失败
        - `login`：会话缺失或过期，需要重新登录

    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]

    SimpleResult:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/Status'

    Bulletin:
      type: object
      properties:
        text:
          type: string
          description: 公告文案
        show:
          type: boolean
          description: 是否展示（前端目前已隐藏该区域）

    Book:
      type: object
      description: 漫画 / 轻小说条目，四个榜单共用同一结构
      required: [Bid, Bookname]
      properties:
        Bid:
          type: integer
          description: 书籍 ID
        Mode:
          type: integer
          description: 内容类型；实测 Mode=1 对应全年龄、Mode=0 对应 R18（语义待确认）
        Bookname:
          type: string
        alias:
          type: string
          description: 别名 / 罗马音；2026-10 新增字段，样例多为空串
        Description:
          type: string
          description: 简介，常见为空串
        Author:
          type: string
          description: 作者，多人时以空格分隔
        Pname:
          type: string
          description: 主角色，大量为占位符「未知」
        Ptag:
          type: string
          description: 标签，**空格分隔**
        Otag:
          type: string
          description: 来源类型，如「原創」
        Time:
          type: integer
          format: int64
          description: 更新时间（unix 秒）
        Views:
          type: integer
        Favorites:
          type: integer
        F:
          type: boolean
          description: 当前用户是否已收藏（未登录恒为 false）
        Len:
          type: integer
          description: 长度 / 话数；全年龄多为 0~2，R18 实测 5~194，语义待确认
        Adult:
          type: integer
          enum: [0, 1]
          description: 0 全年龄 / 1 R18，受请求头 allow-adult 影响
        Status:
          type: integer
          enum: [0, 1]
          description: 0 连载 / 1 完结
        publish_year:
          type: string
          description: 发布年份；可能为空字符串，不保证能转 int（R18 榜单实测全部为空）
        RatingSUM:
          type: number
          format: float
          description: 平均评分（命名有误导性，并非求和）；与 RatingCount 同时为 0 表示无人评分
        RatingCount:
          type: integer
        RatingBayes:
          type: number
          format: float
          description: 样例中恒为 0，疑似未启用

    Stream:
      type: object
      description: 番剧 / 流媒体条目（字段名小写，与 Book 不一致）
      properties:
        sid:
          type: integer
        name:
          type: string
        des:
          type: string
        tags:
          type: string
          description: 标签，**逗号分隔**（与 Book.Ptag 的空格分隔不同）
        pages:
          type: string
          description: 可观看集号，逗号分隔
        type:
          type: integer
          description: 类型标识，样例中恒为 0
        count:
          type: integer
          description: 总集数
        time:
          type: integer
          format: int64
          description: 创建时间（unix 秒）
        up_time:
          type: integer
          format: int64
          description: 最后更新时间（unix 秒）
        f:
          type: boolean
          description: 当前用户是否收藏（小写 f）
        views:
          type: integer
        favorites:
          type: integer

    HomeResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        bulletin:
          $ref: '#/components/schemas/Bulletin'
        favDay:
          type: array
          description: 日收藏榜
          items:
            $ref: '#/components/schemas/Book'
        readDay:
          type: array
          description: 日阅读榜
          items:
            $ref: '#/components/schemas/Book'
        fs:
          type: array
          description: 推荐位，排序规则未确认
          items:
            $ref: '#/components/schemas/Book'
        proportion:
          type: array
          description: 高质 / 编辑推荐，规则未确认
          items:
            $ref: '#/components/schemas/Book'
        stream:
          type: array
          description: 番剧 / 流媒体推荐；**仅当请求体带 `v=3` 时出现**，否则响应里没有这个 key
          items:
            $ref: '#/components/schemas/Stream'
        tags:
          type: array
          description: 首页可用标签
          items:
            type: string

    Badge:
      type: object
      properties:
        Id:
          type: integer
          description: 徽章 ID（数字），与 BadgeResult.show 中的字符串需互相转换
        Name:
          type: string
        Img:
          type: string
          format: uri
          description: 展示用大图
        Minimg:
          type: string
          format: uri
          description: 列表用缩略图
        Des:
          type: string
          description: 获得条件 / 说明

    BadgeResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        data:
          type: array
          description: 账户可用的全部徽章
          items:
            $ref: '#/components/schemas/Badge'
        show:
          type: array
          description: 正在展示的徽章 Id，**字符串数组**
          items:
            type: string

    UserInfo:
      type: object
      properties:
        Email:
          type: string
          format: email
          description: 明文返回，注意脱敏
        Integral:
          type: number
          description: 积分余额，可能是小数（实测 1090.7，按 int 建模会丢精度）
        Time:
          type: integer
          format: int64
          description: 注册 / 首次登录时间（unix 秒），语义待确认
        Uhash:
          type: string
          description: 用户短哈希，出现在头像与图床文件名里
        Uid:
          type: integer
        Username:
          type: string
        Avatar:
          type: string
          description: 头像**相对路径**（`avatar/xxx.webp`），需自行拼图床基地址
        Bg:
          type: string
          description: 背景图**相对路径**（`bg/xxx.webp`）
        CommentLen:
          type: integer
          description: 评论数，样例为 0（待确认）
        Badge:
          type: array
          description: 全部可用徽章（与 `/api/badge` 的 data 同集合），**不反映佩戴状态**；佩戴状态看 `/api/badge` 的 show
          items:
            $ref: '#/components/schemas/Badge'
        Su:
          type: integer
          description: 语义未知，样例恒为 0

    UserInfoResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        userinfo:
          $ref: '#/components/schemas/UserInfo'

    Ad:
      type: object
      properties:
        img:
          type: string
          format: uri
          description: 广告图，托管在图床域名
        url:
          type: string
          format: uri
          description: 点击跳转地址（带第三方推广参数，分享前请打码）

    AdsResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ad'

    SigninRecord:
      type: object
      properties:
        id:
          type: integer
          description: 记录 ID
        uid:
          type: integer
          description: 用户 ID
        continuous:
          type: integer
          description: 该次签到时累计的连续天数
        ip:
          type: string
          description: 签到时的 IP（敏感字段）
        time:
          type: string
          format: date-time
          description: 签到时间，带时区（+08:00）
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 星期，实测 1 = 周一 … 7 = 周日

    SigninRecordResult:
      type: object
      properties:
        status:
          type: integer
          description: 注意是数字 200，不是字符串 "ok"
          examples: [200]
        continuous:
          type: integer
          description: 当前连续签到天数；今天还没签时返回 -1
        data:
          type: array
          description: 签到记录，实测只返回最近 1 条
          items:
            $ref: '#/components/schemas/SigninRecord'
        today:
          type: boolean
          description: 今天是否已签到

    SigninResult:
      type: object
      properties:
        status:
          type: integer
          description: 200 成功 / 500 重复签到
          examples: [200]
        msg:
          type: string
          description: success 或错误文案（英文）
          examples: [success]
        continuous:
          type: integer
          description: 签到后的连续天数

    Post:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: integer
        username:
          type: string
        avatar:
          type: string
          description: 头像相对路径
        title:
          type: string
        content:
          type: string
          description: 正文；表情包以 [noygirl:yeah] 这类代码文本存储
        image:
          type: array
          description: 图片路径数组，元素形如 image/<Uhash>-<sha256>.webp
          items:
            type: string
        time:
          type: integer
          format: int64
          description: 发帖时间（unix 秒）
        expired:
          type: integer
          format: int64
          description: 过期时间，实测 time + 7776000（90 天）
        area:
          type: string
          description: 地区，服务端按 IP 判定（如 Japan）
        platform:
          type: string
          enum: [web, android]
        like:
          type: integer
        reply:
          type: integer
        is_like:
          type: boolean
        su:
          type: integer
          description: 语义未知
        spoiler:
          type: string
          description: |
            **需要模糊的图片下标**，逗号分隔（如 `0,1,2,3,4,5`），空串表示不模糊。
            由服务端判定，发帖时无法指定。
        edit:
          type: integer
          format: int64
          description: 最后编辑时间戳（unix 秒），0 表示从未编辑

    Comment:
      type: object
      properties:
        rid:
          type: integer
          description: 评论 ID（回复别人时作为 reply_id）
        cid:
          type: integer
          description: 所属帖子 ID
        uid:
          type: integer
        username:
          type: string
        avatar:
          type: string
        content:
          type: string
        reply_id:
          type: integer
          description: 顶层评论为 -1
        root_id:
          type: integer
          description: 楼中楼时指向根评论 rid；顶层为 0
        reply_uid:
          type: integer
        reply_username:
          type: string
        reply:
          type: string
          description: 被回复正文摘要
        area:
          type: string
          description: 地区（粗粒度，非 IP）
        time:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        platform:
          type: string
        show_badge:
          type: string
          description: 佩戴徽章缩略图 URL，逗号拼接，顺序与 /api/badge 的 show 一致
        su:
          type: integer
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        reply_more:
          type: boolean
        reply_num:
          type: integer

    CommunityListResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        info:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        len:
          type: integer
          description: 全站帖子总数（不是本页条数）
        over:
          type: boolean
          description: 是否已到末页
        top:
          type: boolean
          description: 是否包含置顶帖

    PostDetailResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: object
          properties:
            post:
              $ref: '#/components/schemas/Post'
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            comment_count:
              type: integer
            top_count:
              type: integer
            uid:
              type: integer
              description: 当前登录用户 UID（不是作者）

    CommentsResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            page:
              type: integer
            over:
              type: boolean
            top_count:
              type: integer

    CommentRepliesResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: object
          properties:
            count:
              type: integer
              description: 该根评论下的回复总数（等于 comments[].reply_num）
            page:
              type: integer
            over:
              type: boolean
            replies:
              type: array
              items:
                $ref: '#/components/schemas/Comment'

    MsgCountResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        count:
          type: object
          properties:
            all:
              type: integer
            comment_reply:
              type: integer
            community_reply:
              type: integer
            sys_msg:
              type: integer

    CommentReplyItem:
      type: object
      description: 书籍评论的回复（type=reply）
      properties:
        cid:
          type: integer
          description: 该回复在书籍评论里的 ID
        bid:
          type: integer
        uid:
          type: integer
        username:
          type: string
        avatar:
          type: string
          description: 恒为空串，头像路径看 avatarUrl
        avatarUrl:
          type: string
        area:
          type: string
        reply:
          type: integer
          description: 被回复评论的 ID
        reply_text:
          type: string
          description: 被回复内容节选
        platform:
          type: string
        time:
          type: integer
          format: int64
        content:
          type: string

    CommunityReplyItem:
      type: object
      description: 帖子下的回复（type=community_reply）
      properties:
        rid:
          type: integer
        cid:
          type: integer
          description: 所属帖子 ID
        uid:
          type: integer
        username:
          type: string
        avatar:
          type: string
          description: 恒为空串
        avatarUrl:
          type: string
        area:
          type: string
        reply:
          type: integer
          description: -1 表示顶层回复
        reply_text:
          type: string
        platform:
          type: string
        time:
          type: integer
          format: int64
        content:
          type: string

    MsgReplyResult:
      type: object
      required: [status, reply]
      properties:
        status:
          type: string
          enum: [ok]
        reply:
          type: object
          properties:
            book:
              type: object
              description: 书籍字典，key 为 Bid 字符串
              additionalProperties:
                type: object
            comment:
              type: array
              items:
                $ref: '#/components/schemas/CommentReplyItem'
            commentLen:
              type: integer
              description: 疑似未读数
            count:
              type: integer

    MsgCommunityReplyResult:
      type: object
      required: [status, community_reply]
      properties:
        status:
          type: string
          enum: [ok]
        community_reply:
          type: object
          properties:
            community:
              type: object
              description: 帖子字典，key 为帖子 id 字符串
              additionalProperties:
                type: object
            community_reply:
              type: array
              description: 实测每页 80 条
              items:
                $ref: '#/components/schemas/CommunityReplyItem'
            community_reply_len:
              type: integer
              description: 疑似未读数
            count:
              type: integer

    MsgSysmsgResult:
      type: object
      required: [status, sysmsg]
      properties:
        status:
          type: string
          enum: [ok]
        sysmsg:
          type: object
          properties:
            count:
              type: integer
            len:
              type: integer
            msg:
              type: array
              description: 系统消息条目结构未观察到（实测恒为空）
              items:
                type: object

    LikeResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        is_like:
          type: boolean
          description: 操作后的点赞状态（toggle 结果）

    UploadTokenResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        token:
          type: string
          description: 短时效上传凭证，现拿现用

    UploadImageResult:
      type: object
      properties:
        status:
          type: string
          enum: [ok, token_format_error]
        file:
          type: string
          description: 图床文件名，形如 `<Uhash>-<sha256>.webp`
          examples: ['91266-13025882b9402bd576b628a1030433a6388156d5aaeccb40362960af47a4aa79.webp']

    BookDetailResult:
      type: object
      description: 书籍详情（`GET /api/v4/book/{bid}`）
      properties:
        status:
          $ref: '#/components/schemas/Status'
        uid:
          type: integer
          description: 当前登录用户 UID
        book:
          type: object
          properties:
            info:
              $ref: '#/components/schemas/Book'
            recommend:
              type: array
              items:
                $ref: '#/components/schemas/RecommendBook'
            translate:
              type: string
              description: 实测为空串，用途未知
        chapters:
          $ref: '#/components/schemas/BookChapters'
        comment:
          type: object
          properties:
            count:
              type: integer
              description: 评论总数，**不含**官方置顶评论
            data:
              type: array
              description: 首屏评论（实测 20 条，可能含 1 条官方置顶）
              items:
                $ref: '#/components/schemas/BookComment'
        points:
          type: object
          properties:
            book_price:
              type: string
              description: 阅读所需积分（**字符串**）
              examples: ['2']
            user_balance:
              type: string
              description: 当前用户积分余额（**字符串**，敏感）

    RecommendBook:
      type: object
      description: 书籍推荐位。注意字段是小写下划线风格，且 mode/status 是布尔（与 Book 的整数不同）
      properties:
        bid:
          type: integer
        bookname:
          type: string
        author:
          type: string
        tags:
          type: string
        views:
          type: integer
        favorites:
          type: integer
        mode:
          type: boolean
        status:
          type: boolean

    BookChapters:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        data:
          type: object
          description: 以分类 id（字符串）为 key 的章节数组
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Chapter'

    Chapter:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        count:
          type: integer
          description: 这一话的页数
        sort:
          type: integer
        created_at:
          type: integer
          format: int64

    BookComment:
      type: object
      description: 书籍评论。与 Comment 同构，但主键字段是 cid
      properties:
        cid:
          type: integer
          description: 评论 ID
        bid:
          type: integer
        uid:
          type: integer
        username:
          type: string
        avatar:
          type: string
        avatarUrl:
          type: string
        content:
          type: string
        reply:
          type: integer
          description: 顶层评论为 -1
        reply_text:
          type: string
        area:
          type: string
        time:
          type: integer
