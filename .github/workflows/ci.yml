name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    name: 文档自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装自检依赖
        run: python3 -m pip install --quiet pyyaml

      # 编码 / BOM / CRLF / JSON / YAML / 站内链接 / 旧域名 / fixture 与文档索引
      - name: scripts/check_docs.py
        run: python3 scripts/check_docs.py

      - name: 示例脚本语法检查
        run: python3 -m py_compile examples/python/noy_client.py

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: redocly lint
        run: npx --yes @redocly/cli@latest lint openapi.yaml --format=stylish
